# For a machine with no graphical session: a server, or a box in an office
# that exists to hold the speakers' LAN and be ssh'd into.
#
# The unit proper wants graphical-session.target, so that on a desktop the
# daemon comes up with the session and goes down with it. On a headless box
# that target never fires, and a daemon enabled against it never starts. This
# points it at default.target instead, which the user manager always reaches.
#
# Installed as a drop-in beside the unit rather than as a second unit, so the
# ExecStart and restart policy stay in one place:
#
#   mkdir -p ~/.config/systemd/user/x2rock.service.d
#   cp systemd/x2rock.service.d/headless.conf ~/.config/systemd/user/x2rock.service.d/
#   systemctl --user daemon-reload
#   systemctl --user enable --now x2rock.service
#   loginctl enable-linger $USER
#
# The last line is load-bearing: without lingering, the user manager - and
# everything it runs - stops when the last ssh session closes.
#
# `PartOf=graphical-session.target` in the unit is left alone. It only
# propagates a stop of that target, and on this machine there is none.
[Install]
WantedBy=
WantedBy=default.target
