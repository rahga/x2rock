[package]
name = "x2rock-deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A Sonos controller for the Steam Deck, Linux desktops and Windows tablets, in the look of x2rock for Android TV."
license = "GPL-3.0-only"
repository = "https://github.com/rahga/x2rockdeck"
publish = false

[dependencies]
anyhow = "1.0.104"
# The local time a sleep timer ends at, as the TV app says it.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
futures-util = "0.3.34"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Send a report's QR code, drawn into an image here.
qrcode = { version = "0.14.1", default-features = false }
# Report redaction: the TV app's patterns, taken as they are.
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The GPLv3 licence option. femtovg (OpenGL) is the renderer; the software
# renderer is here for headless tests and as a fallback where GL is missing.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-path", "software-renderer-systemfonts"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# The Sonos layer, from the x2rock CLI's own package with the CLI left out.
x2rock = { path = "../x2rock", default-features = false }

[build-dependencies]
slint-build = "1.18.1"
# The Windows executable's icon, from dist/x2rock-deck.rc; nothing elsewhere.
embed-resource = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
