[package]
name = "x2rock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first Sonos control for Linux: CLI and MPRIS2 server, no Sonos account"
license = "0BSD"
repository = "https://github.com/rahga/x2rock"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
mpris-server = { version = "0.10.0", features = ["tokio"] }
roxmltree = "0.21.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "1.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` for the restart debouncer, whose settle
# window is two seconds of wall clock the suite should not spend. Same tokio
# already in the tree with one more feature - no new crate, and nothing here
# reaches the release binary.
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
